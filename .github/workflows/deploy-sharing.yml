name: Deploy sharing server

# Publishes ProjectNest.Server to the SmarterASP.net site for project-nest.com.
# Run it from the Actions tab after the secrets below exist.
# It does not run on every push, so a missing secret cannot fail other work.
#
# Enable Web Deploy first: Control Panel → Websites → the site → Manage Website → VS Webdeploy.
# Copy the values from that page (or the downloaded publish profile) into these secrets:
#   SMARTERASP_SITE            Site/Application name, for example username-001-site1
#   SMARTERASP_SERVICE_URL     Service URL, for example
#                              https://winxxxx.site4now.net:8172/MsDeploy.axd?site=username-001-site1
#   SMARTERASP_USERNAME        Web Deploy user, for example username-001
#   SMARTERASP_PASSWORD        Web Deploy password
#   SMARTERASP_CONNECTION_STRING
#                              SQL connection from Database Manager → MSSQL Manager.
#                              Append Encrypt=yes;TrustServerCertificate=true
#                              when the host uses a self-signed SQL certificate.
#
# The desktop app stays pointed at the local server until HTTPS for
# project-nest.com presents a certificate for that name.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Require deploy secrets
        shell: pwsh
        env:
          SMARTERASP_SITE: ${{ secrets.SMARTERASP_SITE }}
          SMARTERASP_SERVICE_URL: ${{ secrets.SMARTERASP_SERVICE_URL }}
          SMARTERASP_USERNAME: ${{ secrets.SMARTERASP_USERNAME }}
          SMARTERASP_PASSWORD: ${{ secrets.SMARTERASP_PASSWORD }}
          SMARTERASP_CONNECTION_STRING: ${{ secrets.SMARTERASP_CONNECTION_STRING }}
        run: |
          $missing = @()
          foreach ($name in @('SMARTERASP_SITE','SMARTERASP_SERVICE_URL','SMARTERASP_USERNAME','SMARTERASP_PASSWORD','SMARTERASP_CONNECTION_STRING')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            throw "Add these GitHub Actions secrets, then run this workflow again: $($missing -join ', ')"
          }

      - name: Publish self-contained win-x64 site
        run: >
          dotnet publish src/ProjectNest.Server/ProjectNest.Server.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=false
          /p:PublishDir=${{ github.workspace }}\publish\sharing\

      - name: Write the production connection string into web.config
        shell: pwsh
        env:
          SMARTERASP_CONNECTION_STRING: ${{ secrets.SMARTERASP_CONNECTION_STRING }}
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'publish\sharing\web.config'
          if (-not (Test-Path $path)) { throw "Publish did not produce $path" }
          $xml = Get-Content -Raw -Path $path
          if ($xml -notlike '*__SHARING_CONNECTION_STRING__*') {
            throw 'web.config is missing the __SHARING_CONNECTION_STRING__ placeholder.'
          }
          $escaped = [System.Security.SecurityElement]::Escape($env:SMARTERASP_CONNECTION_STRING)
          $updated = $xml.Replace('__SHARING_CONNECTION_STRING__', $escaped)
          Set-Content -Path $path -Value $updated -Encoding utf8
          if ((Get-Content -Raw -Path $path) -like '*__SHARING_CONNECTION_STRING__*') {
            throw 'The connection-string placeholder was not replaced.'
          }

      - name: Web Deploy to SmarterASP.net
        shell: pwsh
        env:
          SMARTERASP_SITE: ${{ secrets.SMARTERASP_SITE }}
          SMARTERASP_SERVICE_URL: ${{ secrets.SMARTERASP_SERVICE_URL }}
          SMARTERASP_USERNAME: ${{ secrets.SMARTERASP_USERNAME }}
          SMARTERASP_PASSWORD: ${{ secrets.SMARTERASP_PASSWORD }}
        run: |
          $msdeploy = @(
            "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msdeploy) {
            choco install webdeploy --no-progress -y
            $msdeploy = @(
              "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe",
              "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $msdeploy) { throw 'msdeploy.exe was not found after installing Web Deploy.' }
          $source = Join-Path $env:GITHUB_WORKSPACE 'publish\sharing'
          & $msdeploy `
            -verb:sync `
            -source:contentPath="$source" `
            -dest:contentPath="$env:SMARTERASP_SITE",ComputerName="$env:SMARTERASP_SERVICE_URL",UserName="$env:SMARTERASP_USERNAME",Password="$env:SMARTERASP_PASSWORD",AuthType="Basic",includeAcls="False" `
            -allowUntrusted `
            -enableRule:AppOffline `
            -enableRule:DoNotDeleteRule `
            -disableLink:AppPoolExtension `
            -disableLink:ContentExtension `
            -disableLink:CertificateExtension `
            -verbose
          if ($LASTEXITCODE -ne 0) { throw "msdeploy exited $LASTEXITCODE" }
